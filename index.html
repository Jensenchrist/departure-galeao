<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Departure · Galeão</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Departure">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Inter+Tight:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: sinalização de aeroporto, direta e legível
   IDEA: o mapa é a torre de controle; a lateral é o painel flip-board do terminal
   PICTURE: mapa com pista iluminada, aviões em movimento e plaquinhas numeradas
   COLOUR+TYPE: preto, amarelo #FDE934, cinza #BFBEBE · Inter Tight + Doto (matricial)
   LAYOUT: mapa à esquerda com barra de aproximação embaixo; painel à direita; no celular o painel sobe de baixo */
:root{--y:#FDE934;--k:#000;--k2:#0d0d0d;--k3:#1a1a1a;--w:#fff;--g:#BFBEBE;--r:#ff5a4f;--gr:#46e07a;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#0a0a0a;color:var(--w);font:15px/1.4 "Inter Tight","Helvetica Neue",Arial,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);height:100dvh}
.stage{position:relative;height:100dvh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.zreset{position:absolute;left:10px;top:10px;z-index:12;display:flex;align-items:center;gap:6px;background:var(--k);border:1px solid var(--y);color:var(--y);font-weight:800;font-size:12px;border-radius:18px;padding:6px 12px;min-height:36px}
.zreset[hidden]{display:none}
.zhint{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-weight:700;z-index:12;background:rgba(0,0,0,.7);color:var(--g);font-size:11px;border-radius:12px;padding:4px 10px;pointer-events:none;transition:opacity .6s}
.map{position:absolute;left:0;top:0;transform-origin:0 0;background:url(map.jpg) center/100% 100% no-repeat;overflow:hidden;will-change:transform}

/* aviões */
.pl{position:absolute;transform:translate(-50%,-50%);pointer-events:none;will-change:left,top}
.pl img{display:block;width:100%;transform-origin:50% 50%}
.puff{position:absolute;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,255,255,.95),rgba(225,225,225,.6) 45%,rgba(200,200,200,0) 70%);pointer-events:none;z-index:7;animation:puff 1.6s ease-out forwards}
@keyframes puff{0%{transform:translate(-50%,-50%) scale(.4);opacity:.95}100%{transform:translate(-50%,-50%) scale(3.2);opacity:0}}

/* plaquinhas e áreas de clique */
.sign{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));pointer-events:none;z-index:3}
.sign .plate{background:var(--k);border-radius:4px;padding:1px 6px 2px;color:var(--y);font-weight:800;font-size:clamp(13px,2.2vh,24px);letter-spacing:-.04em;line-height:1.1;border:2px solid transparent;transition:.2s}
.sign .cls{background:var(--y);color:var(--k);font-weight:800;font-size:clamp(7px,.95vh,10px);padding:0 4px;border-radius:2px;margin-top:1px}
.sign.sel .plate{border-color:var(--y);background:var(--y);color:var(--k)}
.sign.ready .plate{border-color:#5dff8f;box-shadow:0 0 6px 2px rgba(70,224,122,.9),0 0 16px 4px rgba(70,224,122,.55);animation:readyGlow 1.4s ease-in-out infinite}
.sign.ready .cls{background:#5dff8f}
@keyframes readyGlow{50%{box-shadow:0 0 10px 3px rgba(93,255,143,1),0 0 26px 8px rgba(70,224,122,.7)}}
.sign.reserved .plate{border-color:var(--y)}
.sign.ok .plate{background:var(--gr);color:var(--k);animation:pulse 1s infinite}
.sign.no{opacity:.35}
@keyframes pulse{50%{transform:scale(1.15)}}
.hit{position:absolute;transform:translate(-50%,-50%);width:17%;height:6.8%;border-radius:10px;z-index:4}
.hit:hover{background:rgba(253,233,52,.12)}
.assign .hit.ok{background:rgba(70,224,122,.18);outline:2px dashed var(--gr)}
.tag{position:absolute;transform:translate(-50%,-100%);background:var(--k);color:var(--w);font-size:clamp(9px,1.2vh,12px);font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap;border-left:3px solid var(--y);pointer-events:none;z-index:5}

/* luzes de cabeceira */
.lt{position:absolute;width:.75%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);z-index:2}
.lt.g{background:#5dff8f;box-shadow:0 0 6px 2px #2cff6a}
.lt.r{background:#ff3b30;box-shadow:0 0 6px 2px #ff1a0d}
.lt.w{background:#fff;box-shadow:0 0 8px 3px #fff;opacity:0;animation:rabbit 1.2s infinite}
.lt.reil{width:1.1%;background:#fff;box-shadow:0 0 10px 4px #fff;opacity:0;animation:strobe 1s infinite}
@keyframes rabbit{0%,12%{opacity:1}20%,100%{opacity:0}}
@keyframes strobe{0%,8%{opacity:1}14%,100%{opacity:0}}
.rwy{position:absolute;transform:translate(-50%,-50%);z-index:3;font-weight:800;font-size:clamp(9px,1.2vh,13px);padding:2px 5px;border-radius:3px;white-space:nowrap;text-align:center;line-height:1.1}
.rwy.on{background:#0d3d1c;color:#5dff8f;border:1px solid #5dff8f}
.rwy.off{background:#3a0d0b;color:#ff6b60;border:1px solid #ff6b60}
.wind{position:absolute;right:8px;top:8px;z-index:6;background:rgba(0,0,0,.85);border-radius:8px;padding:6px 8px;display:flex;gap:8px;align-items:center;border:1px solid #333}
.wind svg{width:34px;height:34px}
.wind b{display:block;font-size:12px}.wind small{display:block;font-size:10px;color:var(--g)}

/* barra de aproximação */
.abar{position:absolute;left:0;right:0;bottom:0;z-index:10;background:linear-gradient(transparent,rgba(0,0,0,.9) 22%);padding:22px 8px 8px}
.abar h2{margin:0 0 6px 4px;font-size:11px;color:var(--g);font-weight:700}
.cards{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;min-height:96px;touch-action:pan-x}
.ac{flex:0 0 auto;width:178px;text-align:left;background:var(--k);border:2px solid #2a2a2a;border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:30px 1fr;gap:2px 8px;align-items:center}
.ac img{grid-row:span 2;width:28px;justify-self:center}
.ac .fn{font-weight:800;font-size:15px;display:flex;justify-content:space-between;gap:4px}
.ac .fn span{font-family:Doto,monospace;color:var(--y);font-weight:900}
.ac .sub{font-size:11px;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac .ft{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;margin-top:4px;padding-top:5px;border-top:1px solid #222}
.ac .ft b{color:var(--y)}
.ac.sel{border-color:var(--y);background:#1d1b06}
.ac.hold{border-color:var(--r)}.ac.hold .ft b.t{color:var(--r)}
.ac.rd{border-color:var(--gr)}.ac.rd .ft b{color:var(--gr)}
.empty{font-size:12px;color:#777;padding:8px 4px}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:20;background:var(--y);color:var(--k);font-weight:800;font-size:13px;padding:8px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.5);max-width:92%;text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
.toast.on{opacity:1}

/* painel lateral */
.side{background:var(--k);display:flex;flex-direction:column;height:100dvh;border-left:3px solid var(--y)}
.top{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.clock{font-family:Doto,monospace;font-weight:900;color:var(--y);font-size:30px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px 10px}
.stats div{background:var(--k3);border-radius:8px;padding:6px 8px}
.stats small{display:block;font-size:10px;color:var(--g)}.stats b{font-size:17px}
.speed{display:flex;gap:4px;padding:0 16px 10px;flex-wrap:wrap}
.speed button{background:var(--k3);color:var(--g);font-size:12px;font-weight:700;padding:6px 10px;border-radius:5px;min-height:32px}
.speed button.on{background:var(--y);color:var(--k)}
.speed .rs{margin-left:auto}
.tabs{display:grid;grid-template-columns:1fr 1fr .8fr;gap:6px;padding:0 16px 12px}
.tab{display:flex;align-items:center;gap:8px;justify-content:center;background:var(--k3);border-radius:8px;min-height:48px;font-weight:800;font-size:15px}
.tab svg{width:20px;height:20px;fill:currentColor}
.tab.on{background:var(--y);color:var(--k)}
.board{flex:1;overflow:auto;background:var(--k2);border-top:1px solid #222}
.head,.row{display:grid;grid-template-columns:50px minmax(0,1fr) 70px 30px 104px;gap:6px;align-items:center;padding:0 12px}
.head{position:sticky;top:0;background:var(--k2);color:var(--g);font-size:11px;font-weight:700;padding-top:8px;padding-bottom:6px;border-bottom:1px solid var(--y);z-index:1}
.row{width:100%;text-align:left;font-family:Doto,monospace;font-weight:900;color:var(--y);font-size:15px;min-height:42px;border-bottom:1px solid #1d1d1d;text-transform:uppercase}
.row:hover{background:#171717}.row.sel{background:#262410}
.row.past{opacity:.38}
.row span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.st{font-size:13px}.st.bad{color:var(--r)}.st.ok{color:var(--gr)}.st.hot{color:var(--w)}

.detail{flex:1;overflow:auto;padding:4px 16px 20px;display:none}
.side.showDetail .board{display:none}.side.showDetail .detail{display:block}
.back{display:flex;align-items:center;gap:6px;color:var(--g);font-weight:700;min-height:44px}
.pass{background:var(--w);color:var(--k);border-radius:10px;overflow:hidden}
.pass .hd{background:var(--k);color:var(--w);padding:14px 16px;border:2px solid var(--w);border-bottom:0;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center}
.pass .air{font-weight:800;font-size:18px}.pass .code{font-family:Doto,monospace;color:var(--y);font-size:22px;font-weight:900}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:16px 16px 6px}
.route .c{font-size:clamp(30px,8vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1}
.route small{display:block;font-size:12px;color:#555;font-weight:500}
.route .r{text-align:right}
.route svg{width:28px;height:28px;margin:0 8px 6px}
.prog{margin:8px 16px 4px;height:6px;background:#e5e5e5;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--k)}
.progl{display:flex;justify-content:space-between;font-size:11px;color:#555;padding:0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;padding:14px 16px 16px}
.grid div small{display:block;font-size:11px;color:#666;font-weight:600}
.grid div b{font-size:17px;font-weight:800;white-space:nowrap}
.perf{border-top:2px dashed #bbb;margin:0 10px}
.statusbig{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 14px}
.statusbig .pill{background:var(--k);color:var(--y);font-family:Doto,monospace;font-weight:900;font-size:17px;padding:6px 10px;border-radius:5px}
.statusbig .gate{font-size:44px;font-weight:800;line-height:.9;letter-spacing:-.04em;text-align:right}
.statusbig .gate small{display:block;font-size:11px;color:#666;letter-spacing:0}
.svc{margin-top:14px;background:var(--k3);border-radius:10px;padding:14px}
.svc h3{margin:0 0 10px;font-size:14px;font-weight:800;display:flex;justify-content:space-between}
.svc h3 span{color:var(--g);font-weight:600;font-size:12px}
.sv{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.sv .b{height:8px;background:#333;border-radius:4px;overflow:hidden}
.sv .b i{display:block;height:100%;background:var(--y);transition:width .3s}
.sv.done .b i{background:var(--gr)}
.sv .p{text-align:right;color:var(--g);font-variant-numeric:tabular-nums;font-size:12px}
.sv.done .p{color:var(--gr)}
.depinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--g);margin-top:12px}
.depinfo b{color:var(--w)}
.go{margin-top:12px;width:100%;min-height:52px;border-radius:8px;background:var(--gr);color:var(--k);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.go:disabled{background:#2a2a2a;color:#777;cursor:not-allowed}
.link{margin-top:12px;width:100%;min-height:46px;border-radius:8px;background:var(--y);color:var(--k);font-weight:800}
.link.ghost{background:var(--k3);color:var(--w)}
.mobileBar{display:none}
.sky{position:absolute;inset:0;background:center/100% 100% no-repeat;opacity:0;pointer-events:none}
#skyT{background-image:url(map_tarde.jpg)}#skyN{background-image:url(map_noite.jpg)}
.daypart{display:block;font-size:10px;color:var(--y);font-weight:700}
/* linguetas laterais */
.rail{position:absolute;right:0;top:86px;bottom:10px;z-index:11;display:flex;flex-direction:column;align-items:flex-end;gap:6px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 0 12px 8px;pointer-events:auto}
.rail::-webkit-scrollbar{display:none}
.tg{display:flex;align-items:stretch;pointer-events:auto;filter:drop-shadow(-3px 4px 8px rgba(0,0,0,.55));flex:none}
.tg-h{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--k);border-left:4px solid var(--y);border-radius:12px 0 0 12px;padding:6px 5px 7px 4px;width:100px;text-align:center;color:var(--w)}
.tg-h img{width:32px;height:32px;object-fit:contain;flex:none;margin-bottom:2px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.tg-h{position:relative}
.tg-fl{position:absolute;left:6px;top:4px;font-size:18px;line-height:1}
.lg{object-fit:contain;background:#fff;border-radius:50%}
.tg-lg{position:absolute;right:4px;top:4px;width:19px;height:19px}
.hd-lg{width:28px;height:28px;vertical-align:middle;margin-right:8px}
.pass .air{display:flex;align-items:center}
.tg-h b{display:block;font-size:16px;line-height:1.05;font-weight:800;letter-spacing:-.01em}
.tg-h small{display:block;font-size:12px;color:var(--y);font-weight:700;font-variant-numeric:tabular-nums}
.tg-c{font-size:11px;font-weight:700;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg-m{font-size:10px;color:var(--g);white-space:nowrap}
.tg-p{margin-top:3px;font-size:9.5px;font-weight:700;color:var(--g);border-top:1px solid #2a2a2a;padding-top:3px;width:100%}
.tg-p em{font-style:normal;font-size:14px;color:var(--y);margin-left:3px}
.tg-now{color:var(--k);background:var(--y);border-radius:4px;border:0;padding:3px 2px;animation:pulse 1s infinite}
.tg.hold .tg-h{border-left-color:var(--r)}.tg.hold .tg-h small{color:var(--r)}
.tg.rd .tg-h{border-left-color:var(--gr);cursor:pointer}.tg.rd .tg-h small{color:var(--gr)}
.tg.sel .tg-h{background:#1d1b06;box-shadow:inset 0 0 0 2px var(--y)}
.tg-go{margin-top:5px;width:100%;background:var(--gr);color:var(--k);font-weight:800;font-size:13px;border-radius:7px;min-height:34px}
@media(max-width:820px){.rail{top:84px}.tg-h{width:92px}}
.rail{top:96px}
.tg-h:focus-visible{outline:2px solid var(--y)}
/* mapa de voos */
.fmap{position:fixed;inset:0;z-index:85;background:#050505;display:flex;flex-direction:column}
.fmap[hidden]{display:none}
.fm-top{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #222}
.fm-t{display:flex;gap:10px;align-items:center;flex:1}
.fm-t .ico{width:36px;height:36px;border-radius:7px}
.fm-t b{font-size:18px;color:var(--y);display:block;line-height:1.1}.fm-t small{display:block;color:var(--g);font-size:11px}
.fm-coord{font-family:Doto,monospace;font-weight:900;color:var(--y);font-size:14px;white-space:nowrap;border:1px solid #333;border-radius:6px;padding:5px 8px}
.fm-x{width:44px;height:44px;border-radius:50%;background:var(--k3);display:flex;align-items:center;justify-content:center;flex:none}.fm-x svg{width:22px;height:22px}
.fm-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 370px;min-height:0}
.fm-mapwrap{position:relative;min-height:0}
#fmCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.fm-note{position:absolute;left:12px;bottom:10px;font-size:11px;color:#777}
.fm-side{overflow:auto;padding:12px;border-left:1px solid #222;display:flex;flex-direction:column;gap:10px}
.fm-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none}
.fm-chip{flex:none;background:var(--k3);border:1px solid #2e2e2e;border-radius:8px;padding:6px 9px;text-align:left;min-width:108px}
.fm-chip b{display:block;font-size:13px}.fm-chip small{display:block;font-size:10px;color:var(--g)}
.fm-chip i{display:block;height:3px;background:#333;border-radius:2px;margin-top:5px;overflow:hidden}.fm-chip i em{display:block;height:100%;background:var(--y)}
.fm-chip.on{border-color:var(--y);background:#1d1b06}
.fm-card{border:1px solid var(--y);border-radius:12px;padding:14px;background:#0b0b0b}
.fm-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid #2a2a2a}
.fm-h .ico{width:30px;height:30px;border-radius:6px}
.fm-h b{font-size:16px;flex:1}.fm-h span{font-family:Doto,monospace;font-weight:900;color:var(--y);font-size:18px}
.fm-leg{display:grid;grid-template-columns:26px 1fr;gap:4px 10px;padding:12px 0;border-bottom:1px solid #2a2a2a}
.fm-leg .frail{grid-row:span 2;display:flex;flex-direction:column;align-items:center}
.fm-leg .frail .ico{width:24px;height:24px;border-radius:5px}
.fm-leg .frail em{flex:1;width:0;border-left:2px dashed var(--y);margin:4px 0;min-height:24px}
.fm-ap small{display:block;font-size:10px;color:var(--g)}
.fm-ap .nm{font-size:12px;color:#ddd}
.fm-ap .cd{font-size:24px;font-weight:800;line-height:1.1;display:flex;align-items:center;gap:8px}
.fm-ap .cd span{font-size:11px;border:1px solid #555;border-radius:3px;padding:1px 5px;font-weight:700;color:var(--g)}
.fm-row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #1d1d1d;font-size:13px}
.fm-row:last-child{border-bottom:0}
.fm-row .ico{width:24px;height:24px;border-radius:5px}
.fm-row span{color:var(--g)}.fm-row b{font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fm-row b.ok{color:var(--gr)}.fm-row b.bad{color:var(--r)}
.fm-wx{display:flex;gap:10px;align-items:center;border:1px dashed #444;border-radius:10px;padding:10px 12px;font-size:12px;color:var(--g)}
.fm-wx b{display:block;color:var(--w);font-size:13px}
.fm-wx>div{flex:1}
.fm-wx{flex-direction:column;align-items:stretch}
.trk{position:relative;height:34px;margin-top:6px;flex:none!important}
.fm-wx>div:first-child{flex:none}
.trk .ln{position:absolute;left:14px;right:14px;top:16px;border-top:2px dashed #444}
.trk .dn{position:absolute;left:14px;top:15px;height:4px;background:var(--y);border-radius:2px}
.trk .ep{position:absolute;top:22px;font-size:10px;font-weight:800;color:var(--g)}
.trk .ep.l{left:0}.trk .ep.r{right:0}
.trk svg{position:absolute;top:1px;width:30px;height:30px;fill:var(--y);transform:translateX(-50%);filter:drop-shadow(0 0 4px rgba(253,233,52,.6))}
.fm-empty{color:#888;font-size:13px;padding:20px 4px}
@media(max-width:820px){
  .fm-body{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:hidden}
  .fm-mapwrap{aspect-ratio:2.15/1}

.go .ico,.link .ico{width:26px;height:26px;border-radius:5px}
.link{display:flex;align-items:center;justify-content:center;gap:8px}
.signs{display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);max-width:560px}
.sgn{display:flex;align-items:center;gap:clamp(8px,1.4vw,16px);background:#141414;border-radius:12px;padding:clamp(8px,1.2vw,14px) clamp(12px,1.6vw,20px);color:var(--y)}
.sgn .arw{width:clamp(28px,4vw,48px);height:clamp(28px,4vw,48px);fill:var(--y);flex:none}
.sgn .ico{width:clamp(36px,5vw,58px);height:clamp(36px,5vw,58px);border-radius:7px}
.sgn b{font-size:clamp(20px,3.4vw,38px);font-weight:800;letter-spacing:-.01em}
.mixer{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.mixer[hidden]{display:none}
.mx-card{background:var(--k);border:2px solid var(--y);border-radius:14px;padding:16px;width:min(380px,100%)}
.mx-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mx-h b{font-size:18px}
.mx-h button{width:44px;height:44px;border-radius:50%;background:var(--k3);display:flex;align-items:center;justify-content:center}.mx-h svg{width:20px;height:20px}
.mx-r{display:grid;grid-template-columns:1fr 44px;gap:2px 10px;align-items:center;margin:12px 0;font-size:14px;font-weight:700}
.mx-r span{grid-column:1/-1;color:var(--g);font-size:12px}
.mx-r input{width:100%;accent-color:var(--y);height:28px}
.mx-r output{text-align:right;font-variant-numeric:tabular-nums;color:var(--y)}
#slots{z-index:120}
.sl-card{width:min(420px,100%)}
.sl{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--k3);border:1px solid #2e2e2e;border-radius:10px;padding:10px 12px;margin-top:8px;min-height:64px}

.sl b{display:block;font-size:15px}.sl small{display:block;font-size:12px;color:var(--g)}
.sl em{font-style:normal;font-size:12px;font-weight:800;color:var(--y)}
.sl.empty b{color:#777}
.sl:disabled{opacity:.45;cursor:not-allowed}
#diffDlg,#dayDlg{z-index:125}
.campl{display:flex;justify-content:space-between;gap:8px;padding:0 16px 8px;font-size:12px;font-weight:800;color:var(--y)}
.stats b.bad{color:var(--r)}
.goals{margin:0 16px 10px;background:var(--k3);border-radius:8px;padding:8px 10px;font-size:12px}
.goals>small{display:block;color:var(--g);font-size:10px;font-weight:700;margin-bottom:3px}
.goals div{display:flex;gap:6px;align-items:center;padding:2px 0;color:#ddd}
.goals div i{font-style:normal;width:14px;color:var(--g)}.goals div b{margin-left:auto;font-variant-numeric:tabular-nums}
.goals div.ok{color:var(--gr)}.goals div.ok i{color:var(--gr)}
.sv.wait .b{background:repeating-linear-gradient(90deg,#3a2a00 0 6px,#2a2a2a 6px 12px)}.sv.wait .p{color:#ffb020}
.crews{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--g);margin-top:10px;padding-top:8px;border-top:1px solid #2a2a2a}
.crews b{color:var(--w)}
.tg.emerg .tg-h{border-left-color:var(--r);animation:mayday .8s infinite}
.tg.emerg .tg-h small{color:#fff;background:var(--r);border-radius:3px;padding:0 4px}
@keyframes mayday{50%{background:#3a0b08}}
#storm{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;transition:opacity 2.5s;
  background:linear-gradient(rgba(12,18,34,.5),rgba(12,18,34,.5)),repeating-linear-gradient(105deg,rgba(210,225,255,.28) 0 1px,transparent 1px 13px);
  background-size:auto,70px 70px;animation:rain .35s linear infinite}
#storm.on{opacity:1}
@keyframes rain{to{background-position:0 0,-24px 70px}}
.day-st{font-size:46px;letter-spacing:6px;color:var(--y);text-align:center;margin:6px 0}

@media(prefers-reduced-motion:reduce){#storm,.tg.emerg .tg-h{animation:none}}
.mx-t{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.mx-t button{flex:1 1 30%;background:var(--k3);border-radius:8px;min-height:40px;font-size:12px;font-weight:700}
.close{display:none;width:44px;height:44px;border-radius:50%;background:var(--k3);align-items:center;justify-content:center}
.close svg{width:22px;height:22px}

/* barra recolhível */
.abh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px 4px}
.abh h2{margin:0}
#abtg{background:var(--k);border:1px solid #444;color:var(--w);font-size:12px;font-weight:700;padding:6px 12px;border-radius:16px;min-height:32px;white-space:nowrap}
#abtg.alert{border-color:var(--r);color:var(--r)}
.abar.min{background:none;padding-top:8px;pointer-events:none}
.abar.min .cards,.abar.min h2{display:none}
.abar.min .abh{justify-content:flex-end;pointer-events:auto}

/* painel de plaquinhas (split-flap) */
.fx{display:flex;gap:1px}
.fl{display:inline-block;position:relative;width:var(--cw,11px);height:calc(var(--cw,11px)*1.45);background:linear-gradient(#262626 0 49.5%,#050505 49.5% 50.5%,#1b1b1b 50.5%);border-radius:2px;color:var(--y);font:700 calc(var(--cw,11px)*1.08)/calc(var(--cw,11px)*1.45) "Inter Tight",Arial,sans-serif;text-align:center;overflow:hidden;transform-origin:50% 50%}
.board .row{font-family:inherit;display:flex;justify-content:space-between;gap:6px;padding:6px 10px;min-height:0}
.board .row .fl{--cw:min(11px,2.75vw)}
.board .head{display:flex;justify-content:space-between;gap:6px;padding:8px 10px 6px}
.board .head span{font-size:10px}
.st-bad .fl{color:var(--r)}.st-ok .fl{color:var(--gr)}.st-hot .fl{color:var(--w)}

/* capa */
.cover{position:fixed;inset:0;z-index:100;background:var(--y);color:var(--k);display:grid;grid-template-rows:auto 1fr auto;padding:clamp(16px,4vw,40px);overflow:hidden;transition:transform .7s cubic-bezier(.7,0,.3,1)}

      h:g.h??(Math.hypot(g.b[0]-p[0],g.b[1]-p[1])>.5?Math.atan2(g.b[0]-p[0],-(g.b[1]-p[1]))*180/Math.PI:h)};
    p=g.b;t+=g.d;s=seg.s1;al=seg.a1;h=seg.h;return seg});
  return {segs:out,end:t};
}
const dist=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
const parkPos=(f,s)=>[s.x-SPR[f.cls-1][1]*SC/2-2,s.y];

/* rede de pistas de táxi, seguindo as linhas amarelas do mapa */
const TWY=318;                                  // taxiway paralela (entre a grama e o pátio)
const CONN=[195,482,975,1308,1560];             // saídas pista ↔ taxiway
const ENTRY=[330,482,640,845,1085,1257];        // ligações taxiway ↔ faixa do pátio
const TD={"10":TH["10"]+200,"28":TH["28"]-200}; // ponto de toque
const DEP={"10":195,"28":1560};                 // saída usada para decolar
const nearest=(arr,y)=>arr.reduce((a,b)=>Math.abs(b-y)<Math.abs(a-y)?b:a);
function viaApron(fromT,s){                     // da taxiway até a posição
  const e=nearest(ENTRY,s.y);
  return [[TWY,e],[LANE,e],[LANE,s.y]];
}
function landingPath(f,r,s){
  const down=r==="10",dir=down?1:-1,td=TD[r],minRoll=250+f.cls*40;
  const ok=CONN.filter(c=>down?c>=td+minRoll:c<=td-minRoll&&c>TH["10"]+100);
  // aviões grandes (classe 5+) usam a pista toda e saem no fim; os médios saem no meio
  const endC=down?CONN[CONN.length-1]:CONN[0];
  const c=f.cls>=5?endC:f.cls>=3?(down?975:482):(ok.length?ok.reduce((a,b)=>Math.abs(b-s.y)<Math.abs(a-s.y)?b:a):endC);
  const p=parkPos(f,s);
  const pts=[[RX,c-dir*28],[262,c],[TWY,c],...viaApron([TWY,c],s)];
  const segs=[{b:[RX,td],d:1.6,s0:1.9,s:1,a0:1,al:0},{b:pts[0],d:Math.max(.9,Math.abs(pts[0][1]-td)/480),e:'out'}];
  let prev=pts[0];
  for(const q of pts.slice(1)){const d=dist(prev,q);if(d>1)segs.push({b:q,d:Math.max(.08,d/280)});prev=q}
  segs.push({b:p,d:Math.max(.2,dist(prev,p)/180),e:'out'});
  const P=mkPath([RX,down?-320:H+320],segs,now,down?180:0);
  P.offRwy=P.segs[2].t+P.segs[2].d;            // pista livre ao chegar na taxiway
  return P;
}
function taxiOutPath(f,r,s){
  const p=parkPos(f,s),c=DEP[r],e=nearest(ENTRY,s.y);
  const pts=[[LANE,s.y],[LANE,e],[TWY,e],[TWY,c],[285,c]];
  const segs=[{b:pts[0],d:1,e:'io',h:90}];let prev=pts[0];
  for(const q of pts.slice(1)){const d=dist(prev,q);if(d>1)segs.push({b:q,d:Math.max(.08,d/260)});prev=q}
  return mkPath(p,segs,now,90);
}
function takeoffPath(f,r){
  const down=r==="10",c=DEP[r];
  return mkPath([285,c],[
    {b:[RX,c],d:.5,e:'out'},
    {b:[RX,c+(down?2:-2)],d:.15,h:down?180:0},
    {b:[RX,down?1000:650],d:1,e:'in'},
    {b:[RX,down?H+320:-320],d:.8,s:1.8,al:1}
  ],now,270);
}
function pose(f){
  const P=f.path;if(!P)return null;
  let g=P.segs.find(x=>now<x.t+x.d)||P.segs[P.segs.length-1];
  const k=clamp((now-g.t)/g.d,0,1),ke=EASE[g.e](k);
  return {x:lerp(g.a[0],g.b[0],ke),y:lerp(g.a[1],g.b[1],ke),h:g.h,s:lerp(g.s0,g.s1,ke),al:lerp(g.a0,g.a1,ke)};
}

/* ---------- simulação ---------- */
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}
/* serviços em solo com equipes limitadas */
const CREW=[null,null,"clean","cat","fuel",null,null];
const CREWNAME={fuel:"Combustível",cat:"Catering",clean:"Limpeza"};
function initSvc(f){f.svs=SERV.map(([n,a,b])=>({s:null,d:(b-a)*f.ground,e0:f.tPark+a*f.ground}))}
const svDone=(f,i)=>f.svs&&f.svs[i].s!=null&&now>=f.svs[i].s+f.svs[i].d;
const svP=(f,i)=>{const v=f.svs&&f.svs[i];return !v||v.s==null?0:clamp((now-v.s)/v.d,0,1)};
const depsOk=(f,i)=>i<5||[2,3,4].every(j=>svDone(f,j));
function crewBusy(){const b={fuel:0,cat:0,clean:0};
  for(const f of flights)if(f.state==="parked"&&f.svs)f.svs.forEach((v,i)=>{const c=CREW[i];if(c&&v.s!=null&&now<v.s+v.d)b[c]++});return b}
function svcStep(){
  const busy=crewBusy(),cap=D().crews;
  const parked=flights.filter(f=>f.state==="parked").sort((a,b)=>a.tPark-b.tPark);
  for(const f of parked){if(!f.svs)initSvc(f);
    f.svs.forEach((v,i)=>{if(v.s!=null||now<v.e0||!depsOk(f,i))return;const c=CREW[i];
      if(c){if(busy[c]>=cap[c]){v.wait=true;return}busy[c]++}v.wait=false;v.s=now;dirty=true})}
}
const waitingCrew=(f,i)=>{const v=f.svs&&f.svs[i];return v&&v.s==null&&v.wait};
const servProg=f=>!f.svs?0:f.svs.reduce((a,_,i)=>a+svP(f,i),0)/f.svs.length;
const isReady=f=>f.state==="parked"&&!!f.svs&&f.svs.every((_,i)=>svDone(f,i));
const stormNow=()=>storms.find(x=>now>=x.s&&now<x.e);
function divert(f){
  if(f.stand!=null&&STANDS[f.stand-1].res===f.i)STANDS[f.stand-1].res=null;
  f.state="diverted";score.diverted++;camp.rep=clamp(camp.rep-6,0,100);camp.money-=8000;
  if(assignFor===f.i)assignFor=null;
  toast(`${f.arrNo} sem combustível · desviado para Guarulhos`);dirty=true;
}

function step(){
  const r=activeRwy();
  // chegadas
  for(const f of flights){
    if(f.state==="inbound"&&now>=f.eta-20){f.state="approach";dirty=true}
    if((f.state==="approach"||f.state==="holding")&&now>=f.eta-1.3){
      const stm=stormNow();
      if(f.stand==null||stm){
        f.eta+=4;f.holds=(f.holds||0)+1;f.holdMin=(f.holdMin||0)+4;
        if(f.state!=="holding")toast(`${f.arrNo} entrou em espera: ${stm?'tempestade sobre a pista':'falta posição'}`);
        f.state="holding";
        if(!f.emerg&&f.holdMin>=D().fuel){f.emerg=true;score.emerg++;toast(`MAYDAY · ${f.arrNo} com pouco combustível!`)}
        else if(f.emerg&&f.holdMin>=D().fuel+12)divert(f);
        dirty=true}
      else if(now<runwayFree){f.eta=runwayFree+1.3}
      else{f.rwy=r;f.path=landingPath(f,r,STANDS[f.stand-1]);f.state="arriving";runwayFree=f.path.offRwy+.2;jet("approach");dirty=true}
    }
    if(f.state==="arriving"&&!f.tdSnd&&now>=f.path.segs[1].t){f.tdSnd=true;jet("touchdown");jet("brake");smoke(f)}
    if(f.state==="arriving"&&now>=f.path.end){f.state="parked";f.tPark=now;f.path=null;score.landed++;initSvc(f);
      if(f.emerg){camp.rep=clamp(camp.rep+2,0,100);toast(`${f.arrNo} pousou em segurança · emergência resolvida`)}dirty=true}
    if(f.state==="parked"&&!f.readyNotified&&isReady(f)){f.readyNotified=true;toast(`${f.depNo} pronto para partir · posição ${pad(f.stand)}`);dirty=true}
  }
  // partidas
  for(const f of flights){
    if(f.state==="departing"){
      const s=STANDS[f.stand-1];
      if(s.res===f.i&&now>=f.path.segs[0].t+f.path.segs[0].d){s.res=null;dirty=true}
      if(now>=f.path.end){f.state="lineup";dirty=true}
    }
    if(f.state==="lineup"&&now>=runwayFree&&!stormNow()){
      const incoming=flights.some(o=>o.state==="arriving"&&now<o.path.segs[1].t+o.path.segs[1].d);
      if(!incoming){f.path=takeoffPath(f,f.rwy);f.state="takeoff";runwayFree=now+2;dirty=true}
    }
    if(f.state==="takeoff"&&!f.toSnd&&now>=f.path.segs[2].t){f.toSnd=true;jet("takeoff")}
    if(f.state==="takeoff"&&now>=f.path.end){
      f.state="gone";f.tOff=now;score.departed++;const late=Math.max(0,Math.round((f.tPush??now)-f.depSched));
      if(late<=15){score.onTime++;camp.rep=clamp(camp.rep+1,0,100)}else{score.lateMin+=late;camp.rep=clamp(camp.rep-(late>40?2:1),0,100)}
      camp.money+=f.cls*1500-Math.max(0,late-15)*40;dirty=true}
  }
  svcStep();stormStep();
}
function stormStep(){
  for(const x of storms){
    if(!x.warned&&now>=x.s-15&&now<x.s){x.warned=true;toast(`⛈ Tempestade chegando em ${Math.ceil(x.s-now)} min`);dirty=true}
    const on=now>=x.s&&now<x.e;
    if(on!==x.on){x.on=on;toast(on?`⛈ Tempestade · pista fechada até ${fmt(x.e)}`:'Tempestade passou · pista reaberta');drawLights();dirty=true}
  }
  $('storm').classList.toggle('on',!!stormNow());
}
function depart(f){
  if(!isReady(f))return;
  f.tPush=now;f.rwy=activeRwy();f.state="departing";f.path=taxiOutPath(f,f.rwy,STANDS[f.stand-1]);
  toast(`${f.depNo} liberado · taxiando para a cabeceira ${f.rwy}`);dirty=true;
}
function assign(f,s){
  if(s.max<f.cls)return toast(`Posição ${pad(s.n)} aceita até classe ${s.max} · ${f.arrNo} é classe ${f.cls}`);
  if(s.res!=null&&s.res!==f.i)return toast(`Posição ${pad(s.n)} está ocupada`);
  if(f.stand!=null)STANDS[f.stand-1].res=null;
  s.res=f.i;f.stand=s.n;assignFor=null;openTab=null;
  toast(`${f.arrNo} vai desembarcar na posição ${pad(s.n)}`);dirty=true;
}

/* ---------- status ---------- */
function arrStatus(f){
  switch(f.state){
    case"inbound":return now<f.eta-f.dur?(f.eta>f.sched?["ATRASADO","bad"]:["PREVISTO",""]):(f.eta>f.sched?["ATRASADO","bad"]:["EM VOO","ok"]);
    case"approach":return["APROXIMAÇÃO","hot"];
    case"holding":return f.emerg?["EMERGÊNCIA","bad"]:["EM ESPERA","bad"];
    case"diverted":return["DESVIADO","bad"];
    case"arriving":return now<f.path.segs[1].t?["POUSANDO","hot"]:["TAXIANDO","ok"];
    default:return["NO PORTÃO","ok"];
  }
}
function depEst(f){
  if(f.state==="parked"&&f.svs){
    const end=i=>{const v=f.svs[i];return v.s!=null?v.s+v.d:Math.max(now,v.e0)+v.d};
    const p1=Math.max(...[0,1,2,3,4].map(end));
    const p2=Math.max(...[5,6].map(i=>{const v=f.svs[i];return v.s!=null?v.s+v.d:Math.max(p1,v.e0,now)+v.d}));
    return Math.max(f.depSched,p2)}
  if(f.state==="parked")return Math.max(f.depSched,f.tPark+f.ground);
  if(["inbound","approach","holding","arriving"].includes(f.state))return Math.max(f.depSched,f.eta+5+f.ground*.95);
  return f.depSched;
}
function depStatus(f){
  switch(f.state){
    case"gone":return["DECOLOU",""];
    case"diverted":return["CANCELADO","bad"];
    case"takeoff":return["DECOLANDO","hot"];
    case"lineup":return["NA CABECEIRA","hot"];
    case"departing":return["TAXIANDO","ok"];
    case"parked":if(isReady(f))return["PRONTO","ok"];if(svP(f,6)>0)return["EMBARQUE","hot"];
  }
  return depEst(f)>f.depSched+15?["ATRASADO","bad"]:["NO HORÁRIO",""];
}

/* ---------- desenho do mapa ---------- */
function drawLights(){
  const r=activeRwy(),w=windNow();let h='';
  // luzes de cabeceira: verde na cabeceira de pouso, vermelha no fim da pista
  for(const end of ["10","28"]){

    for(let i=0;i<9;i++)h+=`<i class="lt ${on?'g':'r'}" style="left:${(181+i*9)/W*100}%;top:${y/H*100}%"></i>`;
    if(on){
      const ys=end==="10"?[4,18,32,46]:[1604,1618,1632,1646,1660];

      h+=`<i class="lt reil" style="left:${172/W*100}%;top:${y/H*100}%"></i><i class="lt reil" style="left:${263/W*100}%;top:${y/H*100}%"></i>`;
    }

}
function drawFixed(){
  // plaquinhas e áreas de clique
  let h='';const af=assignFor!=null?flights[assignFor]:null;
  STANDS.forEach(s=>{
    const f=s.res!=null?flights[s.res]:null;

  });
  map.classList.toggle('assign',!!af);
  fixed.innerHTML=h;
}

/* fumaça dos pneus no toque */
function smoke(f){
  const wpx=SPR[f.cls-1][0]*SC;
  for(let k=0;k<7;k++)setTimeout(()=>{
    const p=pose(f);if(!p)return;
    for(const side of [-1,1]){
      const el=document.createElement('i');el.className='puff';
      const sz=wpx*(.22+Math.random()*.1);
      el.style.cssText=`left:${(p.x+side*wpx*.13)/W*100}%;top:${(p.y+(f.rwy==="10"?-1:1)*wpx*.05)/H*100}%;width:${sz/W*100}%`;
      planesEl.appendChild(el);setTimeout(()=>el.remove(),1700);
    }
  },k*70);
}
const planeEls=new Map();
function drawPlanes(){
  const live=new Set();
  for(const f of flights){
    let p=null;
    if(f.path)p=pose(f);
    else if(f.state==="parked"){const q=parkPos(f,STANDS[f.stand-1]);p={x:q[0],y:q[1],h:90,s:1,al:0}}
    if(!p||f.state==="gone")continue;
    live.add(f.i);
    let el=planeEls.get(f.i);
    if(!el){el=document.createElement('div');el.className='pl';el.innerHTML=`<img src="p${f.cls}.png" alt=""><div class="tag" hidden></div>`;planesEl.appendChild(el);planeEls.set(f.i,el)}
    const wpx=SPR[f.cls-1][0]*SC;
    el.style.left=(p.x/W*100)+'%';el.style.top=(p.y/H*100)+'%';el.style.width=(wpx/W*100)+'%';
    el.style.zIndex=p.al>0?8:1;
    el.style.opacity=p.al>.88?Math.max(0,(1-p.al)/.12):1;
    el.style.filter=`drop-shadow(${-4-34*p.al}px ${5+46*p.al}px ${3+9*p.al}px rgba(0,0,0,${.45-.25*p.al})) brightness(${PB})`;
    el.firstChild.style.transform=`rotate(${p.h}deg) scale(${p.s})`;
    const tg=el.lastChild,show=sel&&sel.i===f.i;
    tg.hidden=!show;if(show){tg.textContent=`${f.state==="arriving"?f.arrNo:f.depNo}`;const [sw,sl]=SPR[f.cls-1];tg.style.cssText=`left:50%;top:${50-50*sw/sl-2}%`}
  }
  for(const [i,el] of planeEls)if(!live.has(i)){el.remove();planeEls.delete(i)}
}

const CH=" ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:.-";
const COLS=[5,9,6,2,10];
const SHORTCITY={"Adis Abeba":"ADIS ABEBA","Casablanca":"CASABLANC","Ilha do Sal":"ILHA SAL","Joanesburgo":"JOANESBRG","Porto Alegre":"P. ALEGRE","Los Angeles":"L.ANGELES","Buenos Aires":"B. AIRES","Cidade do Panamá":"PANAMA","São Paulo":"SAO PAULO","Amsterdã":"AMSTERDA"};

const norm=(t,n)=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9:.\- ]/g,' ').slice(0,n).padEnd(n,' ');
const flips=new Map();
function flapRow(n){let h='<span class="fx">';for(let i=0;i<n;i++)h+='<span class="fl" data-c=" "> </span>';return h+'</span>'}
function setFlaps(group,text){
  const cells=group.children;
  for(let i=0;i<cells.length;i++){
    const el=cells[i],to=text[i]||' ';
    const cur=flips.has(el)?flips.get(el).seq.at(-1):el.dataset.c;
    if(cur===to)continue;
    const a=CH.indexOf(el.dataset.c),b=CH.indexOf(to);let seq=[];
    let k=a<0?0:a;const steps=((b-k)+CH.length)%CH.length;
    if(steps>7)k=(b-6+CH.length)%CH.length;
    while(k!==b){k=(k+1)%CH.length;seq.push(CH[k])}
    if(!seq.length)seq=[to];
    flips.set(el,{seq,i:0,t:performance.now()+Math.random()*120});
  }
}
function flipTick(t){
  for(const [el,f] of flips){
    if(t<f.t)continue;
    const c=f.seq[f.i++];el.textContent=c;el.dataset.c=c;
    if(el.animate)el.animate([{transform:'scaleY(1)'},{transform:'scaleY(.15)',filter:'brightness(.6)'},{transform:'scaleY(1)'}],{duration:70});
    clack();
    f.t=t+55+Math.random()*25;
    if(f.i>=f.seq.length)flips.delete(el);
  }
}

function buildBoard(){
  const arr=tab==="arr";rowsTab=tab;

  let h=`<div class="head"><span>HORA</span><span>${arr?'ORIGEM':'DESTINO'}</span><span>VOO</span><span>POS</span><span>SITUAÇÃO</span></div>`;
  list.forEach(f=>{h+=`<button class="row" data-f="${f.i}">${COLS.map(flapRow).join('')}</button>`});
  board.innerHTML=h;
  rows=[...board.querySelectorAll('.row')].map(el=>({el,f:flights[+el.dataset.f],g:el.children}));
  // alinha o cabeçalho com as colunas
  const hs=board.querySelectorAll('.head span');
  requestAnimationFrame(()=>{const g=rows[0]?.g;if(!g)return;hs.forEach((sp,i)=>{sp.style.width=g[i].offsetWidth+'px'})});
  updateBoard();
}
function updateBoard(){
  if(rowsTab!==tab||rows.length!==flights.length||rows[0]?.f!==flights[rows[0].f.i])return buildBoard();
  const arr=tab==="arr";
  for(const r of rows){
    const f=r.f;const [st,c]=arr?arrStatus(f):depStatus(f);
    const past=arr?(f.tPark!=null&&now>=f.tPark+30):(f.state==="gone"&&now>=f.tOff+15);
    r.el.classList.toggle('past',past);r.el.classList.toggle('sel',!!(sel&&sel.i===f.i));
    setFlaps(r.g[0],fmt(arr?f.sched:f.depSched));
    setFlaps(r.g[1],norm(SHORTCITY[CITY[f.ap]]||CITY[f.ap],9));
    setFlaps(r.g[2],norm(arr?f.arrNo:f.depNo,6));
    setFlaps(r.g[3],f.stand?pad(f.stand):'  ');
    setFlaps(r.g[4],norm(SHORTST[st]||st,10));
    r.g[4].className='fx'+(c?' st-'+c:'');
  }
}

function mkBuses(){
  BUS.master=AC.createGain();BUS.master.connect(AC.destination);
  for(const k of ["flap","engine","brake"]){BUS[k]=AC.createGain();BUS[k].connect(BUS.master)}
  applyMix();
}
function applyMix(){
  if(!BUS.master)return;
  const v=x=>(x/100)**1.6;
  BUS.master.gain.value=soundOn?v(MIX.master)*1.4:0;
  BUS.flap.gain.value=v(MIX.flap)*1.3;BUS.engine.gain.value=v(MIX.engine)*1.4;BUS.brake.gain.value=v(MIX.brake)*1.5;
}
function audioInit(){
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
      const sr=AC.sampleRate,n=Math.floor(sr*.045);clickBuf=AC.createBuffer(1,n,sr);const d=clickBuf.getChannelData(0);
      for(let i=0;i<n;i++){const t=i/sr;d[i]=(Math.random()*2-1)*Math.exp(-t/.0035)*.9+Math.sin(2*Math.PI*190*t)*Math.exp(-t/.008)*.5}}
    if(!BUS.master)mkBuses();
    if(AC.state==="suspended")AC.resume();
  }catch(e){}
}
function clack(){
  if(!soundOn||!AC||AC.state!=="running"||!MIX.flap)return;
  const t=AC.currentTime;if(t-lastClack<.014)return;lastClack=t;
  const src=AC.createBufferSource();src.buffer=clickBuf;src.playbackRate.value=.75+Math.random()*.55;
  const bp=AC.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1800+Math.random()*1400;bp.Q.value=.7;
  const g=AC.createGain();g.gain.value=.18+Math.random()*.16;
  src.connect(bp).connect(g).connect(BUS.flap);src.start();
}

let noiseBuf=null;
function jet(kind){
  if(!soundOn||!AC||AC.state!=="running")return;
  if(!noiseBuf){const n=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);let b=0;for(let i=0;i<n;i++){b=(b+.02*(Math.random()*2-1))/1.02;d[i]=b*3.5+(Math.random()*2-1)*.25}}
  const t=AC.currentTime,out=AC.createGain();out.connect(kind==="brake"||kind==="touchdown"?BUS.brake:BUS.engine);
  const noise=(f0,f1,dur,peak,att,q=.7)=>{const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const lp=AC.createBiquadFilter();lp.type="lowpass";lp.Q.value=q;lp.frequency.setValueAtTime(f0,t);lp.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(lp).connect(g).connect(out);s.start(t);s.stop(t+dur+.1)};
  const tone=(type,f0,f1,dur,peak,att)=>{const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(out);o.start(t);o.stop(t+dur+.1)};
  if(kind==="approach"){noise(1400,350,3.2,.35,1.4);tone("sine",420,300,3,.02,1.2)}
  if(kind==="touchdown"){
    const c=AC.createBufferSource();c.buffer=noiseBuf;const hp=AC.createBiquadFilter();hp.type="highpass";hp.frequency.value=2500;const g=AC.createGain();
    g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);c.connect(hp).connect(g).connect(out);c.start(t);c.stop(t+.15);
    noise(500,900,2.6,.5,.35,1.2);tone("sawtooth",160,90,2.4,.03,.3)}
  if(kind==="brake"){
    // chiado de freio: ruído em faixa estreita + tom com vibrato
    const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const bp=AC.createBiquadFilter();bp.type="bandpass";bp.Q.value=9;
    bp.frequency.setValueAtTime(3300,t);bp.frequency.linearRampToValueAtTime(2500,t+2.6);
    const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.setValueAtTime(.0001,t+.35);g.gain.exponentialRampToValueAtTime(.32,t+.8);g.gain.exponentialRampToValueAtTime(.0001,t+3);
    s.connect(bp).connect(g).connect(out);s.start(t);s.stop(t+3.1);
    const o=AC.createOscillator(),lfo=AC.createOscillator(),lg=AC.createGain(),og=AC.createGain();
    o.type="triangle";o.frequency.setValueAtTime(2900,t);o.frequency.linearRampToValueAtTime(2300,t+2.8);lfo.frequency.value=7;lg.gain.value=45;lfo.connect(lg).connect(o.frequency);
    og.gain.setValueAtTime(.0001,t);og.gain.setValueAtTime(.0001,t+.4);og.gain.exponentialRampToValueAtTime(.025,t+.9);og.gain.exponentialRampToValueAtTime(.0001,t+2.9);
    o.connect(og).connect(out);o.start(t);lfo.start(t);o.stop(t+3);lfo.stop(t+3);
  }
  if(kind==="takeoff"){noise(250,2200,5,.55,1.6);tone("sawtooth",700,2600,4.5,.012,1.2);tone("sine",55,90,4.5,.12,1.2)}
}

const RAD=Math.PI/180;
function gcDist(a,b){const p1=a[0]*RAD,p2=b[0]*RAD,dl=(b[1]-a[1])*RAD,dp=p2-p1;return 2*Math.asin(Math.sqrt(Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2))}
function gcPoint(a,b,t){
  const d=gcDist(a,b);if(d<1e-9)return a;
  const p1=a[0]*RAD,l1=a[1]*RAD,p2=b[0]*RAD,l2=b[1]*RAD,A=Math.sin((1-t)*d)/Math.sin(d),B=Math.sin(t*d)/Math.sin(d);
  const x=A*Math.cos(p1)*Math.cos(l1)+B*Math.cos(p2)*Math.cos(l2),y=A*Math.cos(p1)*Math.sin(l1)+B*Math.cos(p2)*Math.sin(l2),z=A*Math.sin(p1)+B*Math.sin(p2);
  return [Math.atan2(z,Math.hypot(x,y))/RAD,Math.atan2(y,x)/RAD];
}

}
function profile(o){
  const c=o.f.cls,cr=[35000,37000,37000,39000,41000,39000,37000][c-1],vs=[830,840,845,850,905,905,910][c-1];
  if(o.f.state==="holding")return{alt:8000,spd:420,phase:"Em espera sobre o Galeão"};
  const el=o.p*o.dur,rem=o.dur-el,cl=Math.min(25,o.dur*.3),de=Math.min(30,o.dur*.35);

}

const stage=$('stage'),abar=$('abar');

function layoutMap(){
  const r=stage.getBoundingClientRect();SW=r.width;SH=r.height;
  barH=abar.classList.contains('min')?0:abar.offsetHeight;

  zk=clamp(zk,1,4);const dw=bw*zk,dh=bh*zk,avail=SH-barH;

  ZY=dh<=avail?(avail-dh)/2:clamp(ZY,avail-dh,0);
  $('zreset').hidden=zk<1.02;

stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.abar,.zreset,.rail'))return;
  ptrs.set(e.pointerId,rel(e));if(ptrs.size===1){dragged=false;moved=0}
  if(ptrs.size===2){const[a,b]=[...ptrs.values()],m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,k:zk,u:(m.x-ZX)/zk,v:(m.y-ZY)/zk}}

const ramp=(a,b)=>clamp((now-toMin(a))/(toMin(b)-toMin(a)),0,1);
let PB=1,lastPart="";
function skyTick(){
  const t=ramp("15:30","17:00")*(1-ramp("17:45","19:00")),n=ramp("17:45","19:00");
  $('skyT').style.opacity=t;$('skyN').style.opacity=n;
  PB=1-.28*n;
  const part=n>.5?"Noite":t>.5?"Tarde":"Dia";
  if(part!==lastPart){lastPart=part;const el=document.querySelector('.wind small');if(el)el.dataset.p=part;dirty=true}
}

/* ---------- laço ---------- */
let last=performance.now();
function tick(t){
  const dt=Math.min(.25,(t-last)/1000);last=t;
  if(started&&!dayOver)now+=dt*speed/60;
  if(now>=toMin("23:59")&&!dayOver)endDay();
  skyTick();
  flipTick(t);
  step();
  const w=activeRwy();if(w!==lastWind){if(lastWind!==-1)toast(`O vento mudou · pista ${w} em uso`);lastWind=w;drawLights();dirty=true}
  const q=Math.floor(now*4);if(q!==lastQ){lastQ=q;dirty=true}
  if(dirty){dirty=false;drawUI()}
  drawPlanes();
  if(mapOpen)drawFM(t);
  requestAnimationFrame(tick);
}
$('abtg').addEventListener('click',()=>{const a=$('abar');a.classList.toggle('min');$('abtg').setAttribute('aria-expanded',!a.classList.contains('min'));drawBar()});
$('closeSide').addEventListener('click',()=>{side.classList.remove('open');sel=null;side.classList.remove('showDetail');setTabs();dirty=true});
$('snd1').addEventListener('click',()=>setSound(!soundOn));
/* ---------- salvar campanha: 5 posições + automático ---------- */
const AUTO_KEY='departure_save_v1',SLOT_KEY=n=>'departure_slot_'+n;
function snapshot(){return {v:1,diff:DIFF,camp,storms,dayOver,now,speed,ROT,runwayFree,score,stands:STANDS.map(x=>x.res),flights:flights.map(f=>({...f})),at:Date.now()}}
function writeKey(k,manual){
  try{localStorage.setItem(k,JSON.stringify(snapshot()));return true}
  catch(e){if(manual)toast('Não foi possível salvar neste aparelho');return false}
}
function readKey(k){try{const d=JSON.parse(localStorage.getItem(k)||'null');return d&&d.v===1?d:null}catch(e){return null}}
const readSave=()=>readKey(AUTO_KEY);
function loadGame(d){
  DIFF=d.diff||'normal';camp=d.camp||newCamp();storms=d.storms||[];dayOver=false;
  ROT=d.ROT;flights=d.flights;now=d.now;runwayFree=d.runwayFree;score=d.score;
  STANDS.forEach((x,i)=>x.res=d.stands[i]);
  speed=d.speed??10;document.querySelectorAll('#speed button[data-s]').forEach(x=>x.classList.toggle('on',+x.dataset.s===speed));
  $('spdLbl').textContent=speed?speed+'×':'pausa';
  planeEls.forEach(e=>e.remove());planeEls.clear();sel=null;assignFor=null;lastWind=-1;rowsTab=null;
  side.classList.remove('showDetail');drawLights();dirty=true;
}
const when=t=>{const d=new Date(t);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
let slMode='save';
function slotRow(key,label,auto){
  const d=readKey(key),dis=slMode==='load'&&!d;
  return `<button class="sl${d?'':' empty'}${auto?' auto':''}" data-k="${key}" ${dis?'disabled':''}>
    <span class="n">${label}</span>
    <span>${d?`<b>Dia ${d.camp?d.camp.day:1} · ${(DIFFS[d.diff]||DIFFS.normal).name} · ${fmt(d.now)}</b><small>${d.score.landed} pousos · ${d.score.departed} decolagens · ★ ${d.camp?d.camp.stars:0}</small><small>Salvo em ${when(d.at)}</small>`:`<b>${auto?'Sem salvamento automático':'Vazio'}</b><small>${slMode==='save'?'Toque para salvar aqui':'—'}</small>`}</span>
    <em>${slMode==='save'?(d?'Substituir':'Salvar'):(d?'Carregar':'')}</em></button>`;
}
function openSlots(mode){
  slMode=mode;$('slTitle').textContent=mode==='save'?'Salvar jogo':'Carregar jogo';
  let h='';if(mode==='load')h+=slotRow(AUTO_KEY,'A',true);
  for(let n=1;n<=5;n++)h+=slotRow(SLOT_KEY(n),n,false);
  $('slList').innerHTML=h;$('slots').hidden=false;
}
$('slList').addEventListener('click',e=>{
  const b=e.target.closest('.sl');if(!b||b.disabled)return;const k=b.dataset.k;
  if(slMode==='save'){
    if(!started){toast('Comece ou continue um jogo antes de salvar');return}
    if(writeKey(k,true)){toast(`Jogo salvo na posição ${k.slice(-1)} · ${fmt(now)}`);openSlots('save')}
  }else{
    const d=readKey(k);if(!d)return;loadGame(d);$('slots').hidden=true;
    if(!started)$('play').click(); else toast(`Jogo carregado · ${fmt(now)}`);
  }
});
$('slClose').addEventListener('click',()=>$('slots').hidden=true);
$('slots').addEventListener('click',e=>{if(e.target.id==='slots')$('slots').hidden=true});
['saveBtn','saveBtn2'].forEach(id=>$(id).addEventListener('click',()=>openSlots('save')));
['loadBtn','loadBtn2','loadCv'].forEach(id=>$(id).addEventListener('click',()=>openSlots('load')));
function refreshCover(){
  const d=readSave(),b=$('cont');
  if(d){b.hidden=false;b.innerHTML=`Continuar<small>Dia ${d.camp?d.camp.day:1} · ${(DIFFS[d.diff]||DIFFS.normal).name} · ${fmt(d.now)} · ★ ${d.camp?d.camp.stars:0}</small>`;$('play').textContent='Novo jogo'}
  else{b.hidden=true;$('play').textContent='Jogar'}
}
function goHome(){
  if(started)writeKey(AUTO_KEY,false);
  started=false;side.classList.remove('open');closeMap&&closeMap();setTabs();
  refreshCover();const c=$('cover');c.hidden=false;requestAnimationFrame(()=>c.classList.remove('gone'));
}
['homeBtn','homeBtn2'].forEach(id=>$(id).addEventListener('click',goHome));
$('clockBtn').addEventListener('click',()=>{tab=tab||"arr";sel=null;side.classList.remove('showDetail');side.classList.add('open');setTabs();dirty=true});
setInterval(()=>{if(started)writeKey(AUTO_KEY,false)},20000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&started)writeKey(AUTO_KEY,false)});
refreshCover();
$('cont').addEventListener('click',()=>{const d=readSave();if(d)loadGame(d);startGame()});
const mixer=$('mixer');
mixer.querySelectorAll('input').forEach(inp=>{
  const k=inp.dataset.k;inp.value=MIX[k];inp.nextElementSibling.textContent=MIX[k];
  inp.addEventListener('input',()=>{MIX[k]=+inp.value;inp.nextElementSibling.textContent=inp.value;audioInit();applyMix();
    try{localStorage.setItem('departure_mix',JSON.stringify(MIX))}catch(e){}});
});
$('mixBtn').addEventListener('click',()=>{audioInit();mixer.hidden=false});
$('mixClose').addEventListener('click',()=>{mixer.hidden=true});
mixer.addEventListener('click',e=>{
  if(e.target===mixer)mixer.hidden=true;
  const b=e.target.closest('[data-test]');if(!b)return;audioInit();
  if(!soundOn)setSound(true);
  const k=b.dataset.test;
  if(k==="flap"){for(let i=0;i<14;i++)setTimeout(clack,i*60)}
  else if(k==="brake"){jet("touchdown");jet("brake")}
  else jet(k);
});
$('snd2').addEventListener('click',()=>setSound(!soundOn));
/* capa */
let started=false;
const cvTitle=$('cvTitle'),cvSub=$('cvSub');
cvTitle.innerHTML=flapRow(9);cvSub.innerHTML=flapRow(22);
setTimeout(()=>setFlaps(cvTitle.firstChild,"DEPARTURE"),300);
if(!ROT)ROT=genWave(toMin("11:58"),20);
const promo=ROT.map(r=>norm(`${r[5]} ${(SHORTCITY[CITY[r[3]]]||CITY[r[3]])}`,16)+norm(r[0]+r[1],6));
let pi=0;const cycle=()=>{if(started)return;setFlaps(cvSub.firstChild,promo[pi++%promo.length]);setTimeout(cycle,3200)};setTimeout(cycle,900);
let playedOnce=false;
function startGame(){
  audioInit();$('cover').classList.add('gone');started=true;playedOnce=true;
  setTimeout(()=>{$('cover').hidden=true},800);
  rowsTab=null;dirty=true;
}
$('play').addEventListener('click',e=>{if(e.isTrusted){$('diffDlg').hidden=false;return}startGame()});
$('diffClose').addEventListener('click',()=>$('diffDlg').hidden=true);
$('diffDlg').addEventListener('click',e=>{
  if(e.target.id==='diffDlg'){$('diffDlg').hidden=true;return}
  const b=e.target.closest('.df');if(!b)return;
  DIFF=b.dataset.d;camp=newCamp();reset();rowsTab=null;drawLights();$('diffDlg').hidden=true;startGame();
  toast(`Dia 1 · ${D().name} · bom trabalho na torre!`);
});
function endDay(){
  dayOver=true;const gs=goals(),st=gs.filter(g=>g.ok).length;if(camp.scored!==camp.day){camp.scored=camp.day;camp.stars+=st}
  const pct=score.departed?Math.round(score.onTime/score.departed*100)+'%':'--';
  $('dayCard').innerHTML=`<div class="mx-h"><b>Dia ${camp.day} concluído</b></div>
    <div class="day-st">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
    ${gs.map(g=>`<div class="day-row"><span>${g.ok?'✓':'✗'} ${g.t}</span><b>${g.v}</b></div>`).join('')}
    <div class="day-row"><span>Pousos / decolagens</span><b>${score.landed} / ${score.departed}</b></div>
    <div class="day-row"><span>Pontualidade</span><b>${pct}</b></div>
    <div class="day-row"><span>Emergências · desvios</span><b>${score.emerg} · ${score.diverted}</b></div>
    <div class="day-row"><span>Reputação · caixa</span><b>${camp.rep} · ${money(camp.money)}</b></div>
    <button class="day-go" id="nextDay">Começar dia ${camp.day+1}</button>`;
  $('dayDlg').hidden=false;
}
$('dayDlg').addEventListener('click',e=>{if(!e.target.closest('#nextDay'))return;
  camp.day++;reset();rowsTab=null;drawLights();$('dayDlg').hidden=true;writeKey(AUTO_KEY,false);toast(`Dia ${camp.day} · ${D().name}`);dirty=true});
reset();setTabs();requestAnimationFrame(tick);
Object.keys(AIRLINES).forEach(al=>{const im=new Image();im.onload=()=>{LOGO[al]=true;dirty=true};im.src=`logos/${al}.png`});
}
</script>
</body>
</html>
